services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:admin@db:5432/postgres
  worker:
    build: .
    command: python worker.py
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin@db:5432/postgres
    restart: "no"

volumes:
  db_data: