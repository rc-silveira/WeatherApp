apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: weather-api
          image: weather-app:latest
          imagePullPolicy: Never
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: weather-api-service
  namespace: weather-app
spec:
  selector:
    app: weather-api
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer