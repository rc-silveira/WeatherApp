apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ai-tracking-api
  namespace: weather-ai-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-ai-tracking-api
  template:
    metadata:
      labels:
        app: weather-ai-tracking-api
    spec:
      containers:
        - name: weather-ai-tracking-api
          image: weather-ai-tracking:latest
          imagePullPolicy: Never
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: DATABASE_URL
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: GROQ_API_KEY
            - name: AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: AI_MODEL
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secrets
                  key: GROQ_API_KEY
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: weather-ai-tracking-api-service
  namespace: weather-ai-tracking
spec:
  selector:
    app: weather-ai-tracking-api
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer